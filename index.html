<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Asistent - Groq + Web Speech</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; padding: 1rem; background-color: #f4f4f9; }
        .container { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; }
        textarea, input[type="password"] { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        textarea { height: 100px; resize: vertical; }
        .controls { display: flex; gap: 10px; margin-bottom: 20px; }
        button { flex: 1; padding: 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; transition: background 0.3s; }
        #btn-speak { background-color: #ff4757; color: white; }
        #btn-speak.listening { background-color: #2ed573; animation: pulse 1.5s infinite; }
        #btn-submit { background-color: #2f3542; color: white; }
        #btn-submit:disabled { background-color: #a4b0be; cursor: not-allowed; }
        #response-area { background-color: #eef2f5; padding: 15px; border-radius: 4px; min-height: 50px; white-space: pre-wrap; }
        .key-section { margin-top: 20px; border-top: 1px solid #eee; padding-top: 10px; font-size: 0.9rem; }
        #status { font-style: italic; color: #555; text-align: center; height: 20px; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div class="container">
    <h1>AI Asistent</h1>
    
    <p id="status"></p>

    <!-- POLJE ZA UNOS PROMPTA -->
    <textarea id="prompt-input" placeholder="Upiši pitanje ili klikni mikrofon..."></textarea>

    <div class="controls">
        <!-- DUGME ZA MIKROFON -->
        <button id="btn-speak" onclick="toggleListening()">🎤 Pričaj</button>
        <!-- DUGME ZA SLANJE -->
        <button id="btn-submit" onclick="sendToGroq()" disabled>Pošalji na Groq</button>
    </div>

    <h3>Odgovor:</h3>
    <!-- POLJE ZA PRIKAZ ODGOVORA -->
    <div id="response-area">Odgovor će se pojaviti ovdje...</div>

    <!-- SEKCIJA ZA KLJUČ (localStorage) -->
    <div class="key-section" id="key-section">
        <label>Groq API Ključ (spremljeno lokalno):</label>
        <input type="password" id="groq-key-input" placeholder="Unesi gsk_... ključ">
        <div style="display:flex; gap:5px;">
            <button onclick="saveKey()" style="background-color: #2ed573; color:white; flex:none;">Spremi Ključ</button>
            <button onclick="clearKey()" style="background-color: #ff4757; color:white; flex:none;">Obriši</button>
        </div>
        <p style="color: #666; font-size: 0.8rem; margin-top:5px;">*Ključ se sprema samo u tvoj preglednik (localStorage). Nikada se ne šalje na server.</p>
    </div>
</div>

<script>
    // --- KONFIGURACIJA ---
    const STORAGE_KEY = 'groq_api_key';
    const MODEL = "llama-3.3-70b-versatile";

    // --- ELEMENTI ---
    const promptInput = document.getElementById('prompt-input');
    const responseArea = document.getElementById('response-area');
    const btnSpeak = document.getElementById('btn-speak');
    const btnSubmit = document.getElementById('btn-submit');
    const keyInput = document.getElementById('groq-key-input');
    const statusEl = document.getElementById('status');

    // --- INICIJALIZACIJA (Učitavanje ključa) ---
    let savedKey = localStorage.getItem(STORAGE_KEY);
    if (savedKey) {
        keyInput.value = savedKey;
        btnSubmit.disabled = false;
        statusEl.innerText = "Ključ učitan. Spreman.";
    } else {
        statusEl.innerText = "Molimo unesi Groq API ključ na dnu stranice.";
    }

    // --- FUNKCIJE ZA KLJUČ (localStorage) ---
    function saveKey() {
        const key = keyInput.value.trim();
        if (key.startsWith('gsk_')) {
            localStorage.setItem(STORAGE_KEY, key);
            btnSubmit.disabled = false;
            statusEl.innerText = "Ključ uspješno spremljen lokano!";
            setTimeout(() => statusEl.innerText = "Spreman.", 2000);
        } else {
            alert("Čini se da ključ nije ispravan (mora počinjati s 'gsk_').");
        }
    }

    function clearKey() {
        localStorage.removeItem(STORAGE_KEY);
        keyInput.value = '';
        btnSubmit.disabled = true;
        statusEl.innerText = "Ključ obrisan. Unesi novi.";
    }

    // --- SPEECH-TO-TEXT (STT) - Slušanje ---
    let recognition;
    let isListening = false;

    // Provjera podržava li preglednik STT
    if ('webkitSpeechRecognition' in window) {
        recognition = new webkitSpeechRecognition();
        recognition.lang = 'hr-HR'; // Postavi na Hrvatski (ili bs-BA, sr-RS)
        recognition.continuous = false; // Stani kad korisnik prestane pričati
        recognition.interimResults = false; // Pokaži samo konačni rezultat

        recognition.onstart = function() {
            isListening = true;
            btnSpeak.innerText = "🛑 Slušam...";
            btnSpeak.classList.add('listening');
            statusEl.innerText = "Govori sada...";
        };

        recognition.onresult = function(event) {
            const transcript = event.results[0][0].transcript;
            promptInput.value = transcript;
            statusEl.innerText = "Govor prepoznat.";
        };

        recognition.onerror = function(event) {
            console.error("Greška mikrofona:", event.error);
            statusEl.innerText = "Greška mikrofona: " + event.error;
            stopListening();
        };

        recognition.onend = function() {
            stopListening();
        };
    } else {
        btnSpeak.disabled = true;
        btnSpeak.innerText = "🎤 (Nije podržano)";
        statusEl.innerText = "Tvoj preglednik ne podržava Web Speech API (STT). Koristi Chrome/Edge.";
    }

    function toggleListening() {
        if (isListening) {
            recognition.stop();
        } else {
            promptInput.value = ''; // Očisti prethodni unos
            recognition.start();
        }
    }

    function stopListening() {
        isListening = false;
        btnSpeak.innerText = "🎤 Pričaj";
        btnSpeak.classList.remove('listening');
    }


    // --- POVEZIVANJE S GROQ API ---
    async function sendToGroq() {
        const prompt = promptInput.value.trim();
        const apiKey = localStorage.getItem(STORAGE_KEY);

        if (!prompt) { alert("Upiši pitanje!"); return; }
        if (!apiKey) { alert("Ključ nije spremljen!"); return; }

        responseArea.innerText = "AI razmišlja...";
        btnSubmit.disabled = true;
        statusEl.innerText = "Šaljem upit na Groq...";

        try {
            const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${apiKey}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    model: MODEL,
                    messages: [{
                        role: "user",
                        content: prompt
                    }],
                    temperature: 0.7
                })
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.error?.message || `API Greška: ${response.status}`);
            }

            const data = await response.json();
            const aiResponse = data.choices[0].message.content;
            
            // Prikaži odgovor
            responseArea.innerText = aiResponse;
            statusEl.innerText = "Odgovor primljen.";

            // --- TEXT-TO-SPEECH (TTS) - Čitanje ---
            speakText(aiResponse);

        } catch (error) {
            console.error("Greška:", error);
            responseArea.innerText = "Došlo je do greške: " + error.message;
            statusEl.innerText = "Greška u komunikaciji.";
        } finally {
            btnSubmit.disabled = false;
        }
    }

    // --- TEXT-TO-SPEECH (TTS) - Funkcija za čitanje ---
    function speakText(text) {
        if ('speechSynthesis' in window) {
            // Otkaži prethodni govor ako postoji
            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'hr-HR'; // Jezik čitanja (mora biti podržan na uređaju)
            utterance.pitch = 1;
            utterance.rate = 1;

            window.speechSynthesis.speak(utterance);
        } else {
            console.warn("Tvoj preglednik ne podržava speechSynthesis (TTS).");
        }
    }

    // Omogući slanje na Enter (ako se ne drži Shift)
    promptInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey && !btnSubmit.disabled) {
            e.preventDefault();
            sendToGroq();
        }
    });

</script>

</body>
</html>
